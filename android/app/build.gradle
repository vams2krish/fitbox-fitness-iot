plugins { id 'com.android.application' }
android {
    namespace 'com.fitbox.app'
    compileSdk 36
    defaultConfig { applicationId 'com.fitbox.app'; minSdk 26; targetSdk 36; versionCode 8; versionName '0.5.2' }
    signingConfigs { debug { storeFile file(System.getenv('FITBOX_DEBUG_KEYSTORE') ?: new File(System.getProperty('user.home'), '.android/debug.keystore')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    sourceSets { main { assets.srcDirs = ['build/fitbox-v4-assets'] } }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
